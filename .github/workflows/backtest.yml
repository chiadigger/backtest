name: backtest

on:
  workflow_dispatch:           # 手機上按「Run workflow」, 填入想回測的期間
    inputs:
      start_date:    { description: "回測開始日 (YYYY-MM-DD, 留空=最近一年)", default: "" }
      end_date:      { description: "回測結束日 (YYYY-MM-DD, 留空=今天)", default: "" }
      init_capital:  { description: "本金", default: "1000000" }
      max_positions: { description: "最多同時持有幾檔", default: "10" }
      stop_pct:      { description: "移動停損 %", default: "10" }
      bull_days:     { description: "多頭排列至少天數", default: "3" }
      gain_ratio:    { description: "收盤為多頭排列第一天的幾%, 0=不限", default: "120" }
      fee_discount:  { description: "手續費折扣 (1=無折扣, 0.6=6折)", default: "1" }

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy requests lxml matplotlib
      - run: python backtest.py
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          INIT_CAPITAL: ${{ inputs.init_capital || '1000000' }}
          MAX_POSITIONS: ${{ inputs.max_positions || '10' }}
          STOP_PCT: ${{ inputs.stop_pct || '10' }}
          BULL_DAYS: ${{ inputs.bull_days || '3' }}
          GAIN_RATIO: ${{ inputs.gain_ratio || '120' }}
          FEE_DISCOUNT: ${{ inputs.fee_discount || '1' }}
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add backtest_summary.md backtest_trades.csv backtest_equity.csv backtest_equity.png
          git commit -m "update backtest results" || echo "no changes"
          git pull --rebase
          git push
